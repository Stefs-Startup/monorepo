# =============================================================================
# Minimum-Viable Docs Drift & Link Gate (STE-33 / Epic 8)
# =============================================================================
# Verifies that auto-generated tables in docs/ci-reusable-workflows.md stay in
# sync with .github/workflows/reusable-*.yml and discover_projects.py, and that
# internal Markdown file links across docs/ resolve cleanly.
# =============================================================================

name: Docs Check

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/docs-check.mjs"
      - "scripts/docs-check.test.mjs"
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/reusable-node.yml"
      - ".github/workflows/reusable-gradle.yml"
      - ".github/workflows/reusable-web-preview.yml"
      - ".github/scripts/discover_projects.py"
      - ".github/ci-projects.json"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/docs-check.mjs"
      - "scripts/docs-check.test.mjs"
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/reusable-node.yml"
      - ".github/workflows/reusable-gradle.yml"
      - ".github/workflows/reusable-web-preview.yml"
      - ".github/scripts/discover_projects.py"
      - ".github/ci-projects.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs-check:
    name: Minimum-Viable Docs & Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Run docs-check unit tests
        run: node --test scripts/docs-check.test.mjs

      - name: Verify generated docs & internal Markdown links
        run: node scripts/docs-check.mjs --check
