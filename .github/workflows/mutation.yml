# =============================================================================
# Weekly Mutation Testing Pipeline (StrykerJS + Pitest)
# =============================================================================
# Evaluates test-suite fault-detection effectiveness via mutation testing:
#   - StrykerJS (TypeScript / Node workspace via `npm run mutation:test`)
#   - Pitest (Spring Boot / Java 21 domain in `apps/pulse/backend` via `./gradlew pitest`)
# =============================================================================

name: Mutation Testing

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stryker-js:
    name: StrykerJS Mutation Testing (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run StrykerJS mutation tests
        run: npm run mutation:test

      - name: Upload StrykerJS mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-mutation-report
          path: reports/mutation
          if-no-files-found: ignore
          retention-days: 30

  pitest-java:
    name: Pitest Mutation Testing (apps/pulse/backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/pulse/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-home-cache-cleanup: true

      - name: Run Pitest mutation tests
        run: ./gradlew pitest --no-daemon

      - name: Upload Pitest mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest-mutation-report
          path: apps/pulse/backend/build/reports/pitest
          if-no-files-found: ignore
          retention-days: 30
