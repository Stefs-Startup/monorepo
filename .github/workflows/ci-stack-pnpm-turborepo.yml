# =============================================================================
# Stack CI Pipeline — TypeScript / Node / pnpm + Turborepo Workspace
# =============================================================================
# Validates all packages, apps, and tools in the root pnpm + Turborepo stack:
#   - packages/config          (@cmp/config)
#   - packages/utils           (@cmp/utils)
#   - packages/factory         (@cmp/factory)
#   - apps/web                 (@cmp/web)
#   - tools/blast-radius       (@cmp/blast-radius)
#   - tools/blast-radius-ui    (@cmp/blast-radius-ui)
#
# Executes 4 strict gates:
#   1. Gate 1 — Code Quality (lockfile, boundary rules, lint, typecheck)
#   2. Gate 2 — Build (turbo build + per-app artifact verification)
#   3. Gate 3 — Test (per-package & per-app node:test + turbo test)
#   4. Gate 4 — Deploy & Distribution Readiness
# =============================================================================

name: "Stack CI · TypeScript / pnpm + Turborepo"

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".nvmrc"
      - ".node-version"
      - "apps/web/**"
      - "packages/**"
      - "tools/**"
      - ".github/workflows/ci-stack-pnpm-turborepo.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".nvmrc"
      - ".node-version"
      - "apps/web/**"
      - "packages/**"
      - "tools/**"
      - ".github/workflows/ci-stack-pnpm-turborepo.yml"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  code-quality:
    name: "Gate 1 · Code Quality (pnpm + Turborepo)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit monorepo naming & one-way dependency boundaries
        run: |
          node -e '
            const fs = require("node:fs");
            const pkgPaths = [
              "packages/config/package.json",
              "packages/utils/package.json",
              "packages/factory/package.json",
              "apps/web/package.json",
              "tools/blast-radius/package.json",
              "tools/blast-radius-ui/package.json",
            ];
            for (const p of pkgPaths) {
              const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
              if (!pkg.name.startsWith("@cmp/")) {
                throw new Error(`${p} must use @cmp/* scope (found ${pkg.name})`);
              }
              const deps = { ...pkg.dependencies, ...pkg.devDependencies };
              if (p.startsWith("packages/") || p.startsWith("tools/")) {
                for (const d of Object.keys(deps)) {
                  if (d === "@cmp/web") throw new Error(`${p} cannot depend on app ${d}`);
                }
              }
            }
            console.log("Workspace naming and dependency boundaries verified.");
          '

      - name: Lint @cmp/utils & @cmp/web via Turborepo
        # Run through Turborepo so `dependsOn: ["^build"]` builds @cmp/utils
        # (dist/ types) before @cmp/web is type-checked.
        run: pnpm run lint

      - name: Typecheck all pnpm workspaces
        run: pnpm run typecheck

  build:
    name: "Gate 2 · Build (@cmp/utils & @cmp/web)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all Turborepo packages and apps
        run: pnpm run build

      - name: Verify compiled outputs for workspace packages, apps, and tools
        run: |
          test -f packages/utils/dist/src/index.js
          test -f packages/utils/dist/src/index.d.ts
          test -f packages/factory/dist/src/cli.js
          test -f apps/web/dist/src/index.js
          test -f tools/blast-radius/dist/src/cli.js
          test -f tools/blast-radius-ui/dist/index.html
          echo "Verified dist artifacts for @cmp/utils, @cmp/factory, @cmp/web, @cmp/blast-radius, and @cmp/blast-radius-ui."

      - name: Upload Turborepo build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-turborepo-dist
          path: |
            packages/utils/dist/**
            packages/factory/dist/**
            apps/web/dist/**
            tools/blast-radius/dist/**
            tools/blast-radius-ui/dist/**
          retention-days: 7

  test:
    name: "Gate 3 · Test (@cmp/utils & @cmp/web)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run @cmp/utils unit tests
        run: pnpm --filter @cmp/utils run test

      - name: Run @cmp/web application tests
        run: pnpm --filter @cmp/web run test

      - name: Run full Turborepo test suite
        env:
          CI: "true"
        run: pnpm run test

  deploy:
    name: "Gate 4 · Deploy & Distribution (pnpm + Turborepo)"
    needs:
      - code-quality
      - build
      - test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all upstream gates to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result != "success")' > /dev/null; then
            echo "::error::One or more pnpm + Turborepo CI gates failed."
            exit 1
          fi

      - name: Download staged Turborepo artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pnpm-turborepo-dist
          path: staged-pnpm-turborepo

      - name: Publish Stack Readiness Summary
        run: |
          {
            echo "## 📦 TypeScript / pnpm + Turborepo Stack CI Summary"
            echo ""
            echo "| Workspace Package | Path | Quality | Build | Test |"
            echo "| :--- | :--- | :---: | :---: | :---: |"
            echo "| \`@cmp/config\` | \`packages/config\` | ✅ | N/A | N/A |"
            echo "| \`@cmp/utils\` | \`packages/utils\` | ✅ | ✅ (\`dist/src/index.js\`) | ✅ |"
            echo "| \`@cmp/factory\` | \`packages/factory\` | ✅ | ✅ (\`dist/src/cli.js\`) | ✅ |"
            echo "| \`@cmp/web\` | \`apps/web\` | ✅ | ✅ (\`dist/src/index.js\`) | ✅ |"
            echo "| \`@cmp/blast-radius\` | \`tools/blast-radius\` | ✅ | ✅ (\`dist/src/cli.js\`) | ✅ |"
            echo "| \`@cmp/blast-radius-ui\` | \`tools/blast-radius-ui\` | ✅ | ✅ (\`dist/index.html\`) | ✅ |"
            echo ""
            echo "Staged files: \`$(find staged-pnpm-turborepo -type f | wc -l)\`"
          } >> "$GITHUB_STEP_SUMMARY"
