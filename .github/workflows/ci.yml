# =============================================================================
# Monorepo CI/CD Pipeline (CMP-18)
# =============================================================================
# 1. Discover — .github/scripts/discover_projects.py finds every project by
#    convention (gradlew → Gradle, package.json + lockfile → Node) and honours
#    .github/ci-projects.json (excludes such as experimental apps/backstage).
# 2. One reusable language workflow per discovered project, each running the
#    Code Quality → Build → Test gates:
#      .github/workflows/reusable-node.yml    (npm / pnpm + Turborepo / yarn)
#      .github/workflows/reusable-gradle.yml  (Java, Kotlin, Spring Boot, Android)
# 3. Deploy & Distribution — the single required status check: fails if any
#    project failed, then summarises the staged artifacts.
#
# Adding an app needs no change here. The reusable workflows can also be called
# from other repositories in the organization (see each file's header).
# =============================================================================

name: Monorepo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  discover:
    name: Discover Projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gradle: ${{ steps.discover.outputs.gradle }}
      node: ${{ steps.discover.outputs.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover projects
        id: discover
        run: |
          {
            echo '```'
            python3 -I .github/scripts/discover_projects.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify Markdown docs & ADR structure
        run: |
          test -f docs/README.md
          test -f docs/monorepo-conventions.md
          test -d docs/adr
          test -d docs/stack-best-practices
          echo "Documentation structure verified."

  gradle:
    name: Gradle · ${{ matrix.project.path }}
    needs: discover
    if: needs.discover.outputs.gradle != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.gradle) }}
    uses: ./.github/workflows/reusable-gradle.yml
    with:
      working-directory: ${{ matrix.project.path }}
      project-type: ${{ matrix.project.project-type }}
      java-version: ${{ matrix.project.java-version }}
      quality-tasks: ${{ matrix.project.quality-tasks }}
      build-tasks: ${{ matrix.project.build-tasks }}
      test-tasks: ${{ matrix.project.test-tasks }}
      artifact-name: ${{ matrix.project.artifact-name }}

  node:
    name: Node · ${{ matrix.project.path }}
    needs: discover
    if: needs.discover.outputs.node != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.node) }}
    uses: ./.github/workflows/reusable-node.yml
    with:
      working-directory: ${{ matrix.project.path }}
      node-version: ${{ matrix.project.node-version }}
      scripts: ${{ matrix.project.scripts }}
      artifact-name: ${{ matrix.project.artifact-name }}
      artifact-paths: ${{ matrix.project.artifact-paths }}

  # ---------------------------------------------------------------------------
  # Release Readiness Scorecard Gate — mark this as the required check.
  # ---------------------------------------------------------------------------
  deploy:
    name: Release Readiness Scorecard
    needs:
      - discover
      - gradle
      - node
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require every project to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build @cmp/factory and generate scorecard JSON
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cmp/factory... build
          node packages/factory/dist/src/cli.js scorecard --json > factory-scorecard.json

      - name: Download staged build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: staged-artifacts

      - name: Generate release-readiness scorecard.json & DORA summary
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p staged-artifacts
          artifact_count=$(find staged-artifacts -mindepth 1 -maxdepth 1 -type d ! -name '*-reports' | wc -l | tr -d ' ')
          jq -n \
            --arg run_id "$RUN_ID" \
            --arg sha "$SHA" \
            --arg event "$EVENT_NAME" \
            --arg ref "$REF_NAME" \
            --argjson artifact_count "$artifact_count" \
            --argjson needs "$RESULTS" \
            '{
              schemaVersion: 1,
              gate: "release-readiness",
              runId: $run_id,
              sha: $sha,
              event: $event,
              ref: $ref,
              status: "pass",
              artifactCount: $artifact_count,
              jobs: ($needs | with_entries(.value |= .result)),
              doraSignals: {
                changeFailureRateGate: "passed",
                leadTimeTracking: "ci-run-timestamp",
                deploymentFrequencyEligibility: ($ref == "main" and $event == "push")
              }
            }' > scorecard.json

          {
            echo "## 📊 Release Readiness Scorecard"
            echo ""
            echo "| Artifact | Files | Size |"
            echo "| :--- | ---: | ---: |"
            for dir in staged-artifacts/*/; do
              [ -d "$dir" ] || continue
              name=$(basename "$dir")
              case "$name" in *-reports) continue ;; esac
              echo "| \`$name\` | $(find "$dir" -type f | wc -l) | $(du -sh "$dir" | cut -f1) |"
            done
            echo ""
            echo "### DORA & Gate Summary"
            echo ""
            echo "- **Gate Status:** PASS (\`scorecard.json\` generated)"
            echo "- **Change Failure Rate Guard:** All upstream \`discover\`, \`gradle\`, and \`node\` gates passed"
            echo "- **Deploy Eligibility:** \`$([ "$REF_NAME" = "main" ] && [ "$EVENT_NAME" = "push" ] && echo "eligible" || echo "pre-release ($EVENT_NAME)")\`"
            echo "- **Excluded Experimental Apps:** \`apps/backstage\` (via \`.github/ci-projects.json\`)"
            echo ""
            echo "> **Mode:** \`$EVENT_NAME\` on ref \`$REF_NAME\` (\`$SHA\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update sticky PR scorecard comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cmp-release-readiness-scorecard -->';
            const factory = JSON.parse(fs.readFileSync('factory-scorecard.json', 'utf8'));
            const ci = JSON.parse(fs.readFileSync('scorecard.json', 'utf8'));
            const body = [
              marker,
              '## Release Readiness Scorecard',
              '',
              `- **Factory Overall Score:** \`${factory.overallScore ?? 'n/a'}\``,
              `- **CI Gate Status:** \`${ci.status}\` (\`${ci.artifactCount}\` staged artifacts)`,
              `- **Commit:** \`${ci.sha}\``,
              '',
              '<details>',
              '<summary>Factory Scorecard JSON</summary>',
              '',
              '```json',
              JSON.stringify(factory, null, 2),
              '```',
              '</details>'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Upload release-readiness scorecard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness-scorecard
          path: |
            scorecard.json
            factory-scorecard.json
          retention-days: 30
