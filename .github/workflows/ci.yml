# =============================================================================
# Monorepo CI/CD Pipeline (CMP-18)
# =============================================================================
# Validates every PR, Merge Queue group, and main branch push across 4 gates:
#   1. Code Quality (Turborepo Lint/Typecheck, Docs Integrity & Android Lint)
#   2. Build (Turborepo Packages, Pulse Android APK, Spring Boot 4 & Web Bundle)
#   3. Test (Turborepo Tests, Pulse JUnit4/MockWebServer/WCAG Audit, JUnit5 & Vitest)
#   4. Deploy & Distribution Gate (Artifact Verification & Deployment Placeholder)
# =============================================================================

name: Monorepo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Quality — Linting, Typechecking, Docs & Static Analysis
  # ---------------------------------------------------------------------------
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup Java (JDK 17 & 21)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: |
            17
            21

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install root pnpm workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turborepo workspace linters
        run: pnpm run lint --ui=stream

      - name: Run Turborepo workspace TypeScript typecheck
        run: pnpm run typecheck --ui=stream

      - name: Verify TechDocs & ADR documentation structure
        run: |
          test -f mkdocs.yml
          test -f catalog-info.yaml
          test -f docs/monorepo-conventions.md
          test -d docs/adr
          test -d docs/stack-best-practices
          echo "Documentation structure verified."

      - name: Run Pulse Web TypeScript & Angular compiler check
        working-directory: apps/pulse/web
        run: |
          npm ci
          npx tsc --noEmit

      - name: Run Pulse Android Lint
        working-directory: apps/pulse
        run: ./gradlew lintDebug --no-daemon

      - name: Upload Android Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-lint-report
          path: apps/pulse/app/build/reports/lint-results-debug.html
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Build — Compile & Package Workspace Libraries, Mobile APK & Web Bundles
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup Java (JDK 17 & 21)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: |
            17
            21

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install root pnpm workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Turborepo workspace packages & apps
        run: pnpm run build --ui=stream

      - name: Build Pulse Android Debug APK
        working-directory: apps/pulse
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Pulse Spring Boot 4 Backend (Java 21)
        working-directory: apps/pulse/backend
        run: ./gradlew classes testClasses --no-daemon

      - name: Build Pulse Web Production Bundle
        working-directory: apps/pulse/web
        run: |
          npm ci
          npm run build

      - name: Upload Workspace Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workspace-dist
          path: packages/utils/dist
          retention-days: 7

      - name: Upload Pulse Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-debug-apk
          path: apps/pulse/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Pulse Web Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: pulse-web-dist
          path: apps/pulse/web/dist/pulse-web
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Test — Unit, Contract, Integration & WCAG 2.2 AA Accessibility Suites
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup Java (JDK 17 & 21)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: |
            17
            21

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install root pnpm workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turborepo workspace test suite
        run: pnpm run test --ui=stream

      - name: Run Pulse Android Unit, MockWebServer Contract & WCAG 2.2 AA Tests
        working-directory: apps/pulse
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Pulse Spring Boot 4 / Java 21 Backend Tests
        working-directory: apps/pulse/backend
        run: ./gradlew test --no-daemon

      - name: Run Pulse Web Vitest Suite
        working-directory: apps/pulse/web
        run: |
          npm ci
          npm test

      - name: Upload Pulse Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-test-reports
          path: |
            apps/pulse/app/build/reports/tests/testDebugUnitTest
            apps/pulse/backend/build/reports/tests/test
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Deploy & Distribution Gate (Placeholder)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy & Distribution
    needs:
      - code-quality
      - build
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download staged build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged-artifacts

      - name: Verify staged distribution artifacts
        run: |
          ls -la staged-artifacts
          test -f staged-artifacts/pulse-debug-apk/app-debug.apk
          test -d staged-artifacts/pulse-web-dist
          test -d staged-artifacts/workspace-dist
          echo "All staged artifacts verified and ready for distribution."

      - name: Execute Deploy & Distribution Placeholder
        run: |
          APK_SIZE=$(du -h staged-artifacts/pulse-debug-apk/app-debug.apk | cut -f1)
          {
            echo "## 🚀 Monorepo Deploy & Distribution Gate"
            echo ""
            echo "| Target | Artifact | Status | Distribution Strategy |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **Workspace Libraries** (\`@cmp/utils\`) | \`workspace-dist\` | ✅ Staged | Internal workspace symlink (\`workspace:*\`) |"
            echo "| **Pulse Android** (\`:app\`) | \`app-debug.apk\` (\`$APK_SIZE\`) | ✅ Staged | Pending distribution channel selection (Firebase App Distribution / GitHub Releases / Play Internal) |"
            echo "| **Pulse Web** (\`apps/pulse/web\`) | \`pulse-web-dist\` | ✅ Staged | Pending web hosting target configuration (Firebase Hosting / Cloud Run / Render) |"
            echo "| **Backstage Portal** (\`apps/backstage\`) | \`render.yaml\` | ⏸️ Placeholder | Configured via \`render.yaml\` Docker service; web service deploy automation deferred |"
            echo ""
            echo "> **Mode:** \`${{ github.event_name }}\` on ref \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
