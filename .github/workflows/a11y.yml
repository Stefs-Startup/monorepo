name: "Accessibility E2E (WCAG 2.2 AA)"

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/a11y.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/a11y.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  a11y-e2e:
    name: "Playwright + axe-core WCAG 2.2 AA"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Install Playwright and axe-core for @cmp/web
        run: npm install --no-save --prefix apps/web @playwright/test @axe-core/playwright

      - name: Install Playwright Chromium browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run WCAG 2.2 AA E2E tests
        run: pnpm --filter @cmp/web test:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-a11y-report
          path: apps/web/playwright-report/
          retention-days: 14
