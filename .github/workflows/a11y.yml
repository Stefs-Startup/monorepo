name: "Accessibility E2E (WCAG 2.2 AA)"

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/a11y.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/a11y.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  a11y-e2e:
    name: "Playwright + axe-core WCAG 2.2 AA"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Install Playwright and axe-core for @cmp/web
        run: pnpm --filter @cmp/web add -D @playwright/test @axe-core/playwright

      - name: Install Playwright Chromium browser
        run: pnpm --filter @cmp/web exec playwright install --with-deps chromium

      - name: Run WCAG 2.2 AA E2E tests
        run: pnpm --filter @cmp/web test:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-a11y-report
          path: apps/web/playwright-report/
          retention-days: 14
