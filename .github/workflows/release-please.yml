# =============================================================================
# Release Automation — release-please Monorepo Mode (STE-41)
# =============================================================================
# Opens and updates per-package release PRs with generated CHANGELOGs and
# bumps versions in package.json / build.gradle.kts. Merging a release PR
# creates <component>-v<version> tags (e.g. pulse-backend-v0.6.1,
# pulse-web-v0.6.1) which trigger deploy-cloud-run.yml.
# =============================================================================

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
