# =============================================================================
# Template Smoke CI — Generator & Shared Package Verification (STE-49)
# =============================================================================
# Generates a throwaway TypeScript library via `pnpm gen lib smoke-test-lib`
# whenever generators, templates, or shared packages change, links it into the
# pnpm workspace, and runs lint, typecheck, build, and unit tests against it.
# =============================================================================

name: "Template Smoke CI"

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/gen.mjs"
      - "turbo/generators/**"
      - "packages/config/**"
      - "packages/utils/**"
      - "packages/factory/**"
      - ".github/workflows/template-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/gen.mjs"
      - "turbo/generators/**"
      - "packages/config/**"
      - "packages/utils/**"
      - "packages/factory/**"
      - ".github/workflows/template-smoke.yml"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  template-smoke:
    name: "Smoke Test · pnpm gen lib"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate throwaway TypeScript library
        run: pnpm gen lib smoke-test-lib

      - name: Link generated package in pnpm workspace
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Verify generated package structure and workspace registration
        run: |
          for file in \
            packages/smoke-test-lib/AGENTS.md \
            packages/smoke-test-lib/README.md \
            packages/smoke-test-lib/eslint.config.mjs \
            packages/smoke-test-lib/package.json \
            packages/smoke-test-lib/tsconfig.json \
            packages/smoke-test-lib/tsconfig.build.json \
            packages/smoke-test-lib/src/index.ts \
            packages/smoke-test-lib/src/index.test.ts; do
            test -f "$file" || { echo "Missing generated file: $file"; exit 1; }
          done
          pnpm --filter @cmp/smoke-test-lib exec pwd

      - name: Run lint, typecheck, build, and test on generated library
        run: |
          pnpm --filter @cmp/smoke-test-lib lint
          pnpm --filter @cmp/smoke-test-lib typecheck
          pnpm --filter @cmp/smoke-test-lib build
          pnpm --filter @cmp/smoke-test-lib test
          test -f packages/smoke-test-lib/dist/src/index.js
          test -f packages/smoke-test-lib/dist/src/index.d.ts

      - name: Clean up throwaway package
        if: always()
        run: rm -rf packages/smoke-test-lib
