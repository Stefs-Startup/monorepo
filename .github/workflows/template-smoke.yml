# =============================================================================
# Template Smoke CI — Generator & Shared Package Verification (STE-49)
# =============================================================================
# Verifies every generator template whenever generators, templates, shared
# packages, or Gradle convention plugins change:
#   1. `pnpm gen lib smoke-test-lib`          (STE-45 · TypeScript library)
#   2. `pnpm gen app web smoke-web`           (STE-46 · Angular 21 Signals web app)
#   3. `pnpm gen app service smoke-service`   (STE-47 · Spring Boot 4 / Java 21 service)
#   4. `pnpm gen app android smoke-android`   (STE-48 · Android Kotlin / Compose app)
# =============================================================================

name: "Template Smoke CI"

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/gen.mjs"
      - "scripts/gen.test.mjs"
      - "turbo/generators/**"
      - "packages/config/**"
      - "packages/utils/**"
      - "packages/factory/**"
      - "build-logic/**"
      - "gradle/libs.versions.toml"
      - ".github/workflows/template-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/gen.mjs"
      - "scripts/gen.test.mjs"
      - "turbo/generators/**"
      - "packages/config/**"
      - "packages/utils/**"
      - "packages/factory/**"
      - "build-logic/**"
      - "gradle/libs.versions.toml"
      - ".github/workflows/template-smoke.yml"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  template-smoke:
    name: "Smoke Test · pnpm gen templates"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run generator CLI unit tests
        run: node --test scripts/gen.test.mjs

      - name: "Smoke Test 1 · TypeScript library (STE-45: pnpm gen lib)"
        run: |
          pnpm gen lib smoke-test-lib
          pnpm install --no-frozen-lockfile --prefer-offline
          for file in \
            packages/smoke-test-lib/AGENTS.md \
            packages/smoke-test-lib/README.md \
            packages/smoke-test-lib/eslint.config.mjs \
            packages/smoke-test-lib/package.json \
            packages/smoke-test-lib/tsconfig.json \
            packages/smoke-test-lib/tsconfig.build.json \
            packages/smoke-test-lib/src/index.ts \
            packages/smoke-test-lib/src/index.test.ts; do
            test -f "$file" || { echo "Missing generated file: $file"; exit 1; }
          done
          pnpm --filter @cmp/smoke-test-lib lint
          pnpm --filter @cmp/smoke-test-lib typecheck
          pnpm --filter @cmp/smoke-test-lib build
          pnpm --filter @cmp/smoke-test-lib test
          test -f packages/smoke-test-lib/dist/src/index.js
          test -f packages/smoke-test-lib/dist/src/index.d.ts
          rm -rf packages/smoke-test-lib
          git checkout -- pnpm-lock.yaml

      - name: "Smoke Test 2 · Angular 21 Web App (STE-46: pnpm gen app web)"
        run: |
          pnpm gen app web smoke-web
          for file in \
            apps/smoke-web/AGENTS.md \
            apps/smoke-web/README.md \
            apps/smoke-web/package.json \
            apps/smoke-web/angular.json \
            apps/smoke-web/tsconfig.json \
            apps/smoke-web/tsconfig.app.json \
            apps/smoke-web/vitest.config.ts \
            apps/smoke-web/eslint.config.mjs \
            apps/smoke-web/scripts/lint-angular.mjs \
            apps/smoke-web/src/main.ts \
            apps/smoke-web/src/app/app.config.ts \
            apps/smoke-web/src/app/app.routes.ts \
            apps/smoke-web/src/app/auth/auth.slot.ts \
            apps/smoke-web/src/app/app.component.ts \
            apps/smoke-web/src/app/app.component.spec.ts; do
            test -f "$file" || { echo "Missing generated file: $file"; exit 1; }
          done
          (cd apps/pulse/web && npm ci --prefer-offline)
          ln -sfn ../pulse/web/node_modules apps/smoke-web/node_modules
          (
            cd apps/smoke-web
            npm run lint
            npm run typecheck
            npm run build
            npm test
          )
          test -d apps/smoke-web/dist/smoke-web
          rm -rf apps/smoke-web

      - name: "Smoke Test 3 · Spring Boot 4 Service (STE-47: pnpm gen app service [--infra])"
        run: |
          pnpm gen app service smoke-service --infra
          for file in \
            apps/smoke-service/AGENTS.md \
            apps/smoke-service/README.md \
            apps/smoke-service/build.gradle.kts \
            apps/smoke-service/settings.gradle.kts \
            apps/smoke-service/compose.yaml \
            apps/smoke-service/gradlew \
            apps/smoke-service/src/main/java/com/cmp/service/ServiceApplication.java \
            apps/smoke-service/src/main/java/com/cmp/service/domain/ServiceStatusEngine.java \
            apps/smoke-service/src/main/java/com/cmp/service/api/ServiceStatusController.java \
            apps/smoke-service/src/test/java/com/cmp/service/api/ServiceContractTest.java; do
            test -f "$file" || { echo "Missing generated file: $file"; exit 1; }
          done
          test -x apps/smoke-service/gradlew
          (
            cd apps/smoke-service
            ./gradlew codeQuality test --no-daemon --stacktrace
          )
          rm -rf apps/smoke-service

      - name: "Smoke Test 4 · Android Kotlin/Compose App (STE-48: pnpm gen app android)"
        run: |
          pnpm gen app android smoke-android
          for file in \
            apps/smoke-android/AGENTS.md \
            apps/smoke-android/README.md \
            apps/smoke-android/build.gradle.kts \
            apps/smoke-android/settings.gradle.kts \
            apps/smoke-android/gradlew \
            apps/smoke-android/app/build.gradle.kts \
            apps/smoke-android/app/src/main/AndroidManifest.xml \
            apps/smoke-android/app/src/main/java/com/cmp/androidapp/MainActivity.kt \
            apps/smoke-android/app/src/test/java/com/cmp/androidapp/MainScreenDomainTest.kt; do
            test -f "$file" || { echo "Missing generated file: $file"; exit 1; }
          done
          test -x apps/smoke-android/gradlew
          (
            cd apps/smoke-android
            ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          )
          test -f apps/smoke-android/app/build/outputs/apk/debug/app-debug.apk
          rm -rf apps/smoke-android
