# =============================================================================
# Reusable Workflow — Gradle (Java, Kotlin, Spring Boot, Android)
# =============================================================================
# Runs the standard quality → build → test gates for one Gradle build (a
# directory with a Gradle wrapper). Android builds are detected from the build
# scripts and get Android defaults; anything else gets plain JVM defaults. Any
# task list can be overridden, and an empty list skips that gate.
#
# Usage from any repository in the organization:
#
#   jobs:
#     api:
#       uses: Stefs-Startup/monorepo/.github/workflows/reusable-gradle.yml@main
#       with:
#         working-directory: services/api   # optional, defaults to "."
#
# Defaults            quality      build                   test
#   android           lintDebug    assembleDebug           testDebugUnitTest
#   jvm               (none)       assemble testClasses    test
# =============================================================================

name: Reusable · Gradle

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing gradlew.
        type: string
        default: "."
      java-version:
        description: JDK(s) to install, newline-separated; the last one becomes JAVA_HOME. Toolchains can use any of them.
        type: string
        default: "21"
      project-type:
        description: "auto | android | jvm"
        type: string
        default: "auto"
      quality-tasks:
        description: Gradle tasks for the quality gate. "default" = type default, "" = skip.
        type: string
        default: "default"
      build-tasks:
        description: Gradle tasks for the build gate. "default" = type default, "" = skip.
        type: string
        default: "default"
      test-tasks:
        description: Gradle tasks for the test gate. "default" = type default, "" = skip.
        type: string
        default: "default"
      artifact-name:
        description: Name for the uploaded build outputs. Empty = gradle-<working-directory>.
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read

jobs:
  gradle:
    name: Quality · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Resolve project type & tasks
        id: plan
        env:
          TYPE: ${{ inputs.project-type }}
          QUALITY: ${{ inputs.quality-tasks }}
          BUILD: ${{ inputs.build-tasks }}
          TEST: ${{ inputs.test-tasks }}
          INPUT_ARTIFACT: ${{ inputs.artifact-name }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          test -f gradlew || { echo "::error::No gradlew in $WORKDIR"; exit 1; }
          chmod +x gradlew

          if [ "$TYPE" = "auto" ]; then
            # Applied Android plugin or android {} block; version catalogs are ignored on purpose.
            if grep -rqsE --include='*.gradle' --include='*.gradle.kts' \
                 'com\.android\.|libs\.plugins\.android\b|^\s*android\s*\{' .; then
              TYPE=android
            elif grep -rqsE --include='*.gradle' --include='*.gradle.kts' \
                 'kotlin\(\s*"multiplatform"\s*\)|org\.jetbrains\.kotlin\.multiplatform' .; then
              TYPE=kmp
            else
              TYPE=jvm
            fi
          fi

          if [ "$TYPE" = "android" ]; then
            d_quality="lintDebug"; d_build="assembleDebug"; d_test="testDebugUnitTest"
          elif [ "$TYPE" = "kmp" ]; then
            d_quality="codeQuality"; d_build="jvmJar compileProductionExecutableKotlinWasmJs"; d_test="jvmTest"
          else
            if grep -rqs 'tasks\.register("codeQuality")' .; then d_quality="codeQuality"; else d_quality=""; fi
            d_build="assemble testClasses"; d_test="test"
          fi
          if [ "$QUALITY" = "default" ]; then QUALITY="$d_quality"; fi
          if [ "$BUILD" = "default" ];   then BUILD="$d_build"; fi
          if [ "$TEST" = "default" ];    then TEST="$d_test"; fi

          slug=$(echo "$WORKDIR" | tr -c 'A-Za-z0-9\n' '-' | sed 's/^-*//;s/-*$//')
          name="$INPUT_ARTIFACT"
          if [ -z "$name" ]; then name="gradle-${slug:-root}"; fi

          {
            echo "type=$TYPE"
            echo "quality=$QUALITY"
            echo "build=$BUILD"
            echo "test=$TEST"
            echo "artifact=$name"
          } >> "$GITHUB_OUTPUT"
          echo "Gradle $TYPE build in $WORKDIR — quality: '${QUALITY:-skip}', build: '${BUILD:-skip}', test: '${TEST:-skip}'"

      - name: "Gate 1 · Code Quality"
        if: steps.plan.outputs.quality != ''
        run: ./gradlew ${{ steps.plan.outputs.quality }} --no-daemon --stacktrace

      - name: "Gate 2 · Build"
        if: steps.plan.outputs.build != ''
        run: ./gradlew ${{ steps.plan.outputs.build }} --no-daemon --stacktrace

      - name: "Gate 3 · Test"
        if: steps.plan.outputs.test != ''
        run: ./gradlew ${{ steps.plan.outputs.test }} --no-daemon --stacktrace

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: |
            ${{ inputs.working-directory }}/**/build/outputs/apk/**/*.apk
            ${{ inputs.working-directory }}/**/build/outputs/bundle/**/*.aab
            ${{ inputs.working-directory }}/**/build/libs/*.jar
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.artifact }}-reports
          path: |
            ${{ inputs.working-directory }}/**/build/reports/**
            ${{ inputs.working-directory }}/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
